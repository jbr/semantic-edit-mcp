[package]
name = "semantic-edit-mcp"
version = "0.4.0"
edition = "2024"
description = "MCP server for code editing"
readme = "README.md"
repository = "https://github.com/jbr/semantic-edit-mcp"
documentation = "https://docs.rs/semantic-edit-mcp"
license = "MIT OR Apache-2.0"
keywords = ["mcp", "tree-sitter", "semantic-editing", "code-editing"]
categories = ["development-tools", "text-processing"]

[dependencies]
anyhow = "1.0"
async-compat = "0.2"
clap = { version = "4.6", features = ["derive"] }
diffy = { version = "0.5.2", features = ["color"] }
enum-map = "3.1.0"
env_logger = "0.11"
fieldwork = "0.5.5"
log = "0.4.34"
mcplease = "0.5"
# Line and column for syn's diagnostics.
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
ropey = "1.6"
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1.2"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing"] }
taplo = "0.14.0"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tree-sitter = "0.27"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-plain = "0.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
toml_edit = { version = "0.25.15", features = ["serde"] }

